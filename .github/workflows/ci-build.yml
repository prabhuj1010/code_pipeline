name: Java CI with Gradle

on:
  push:
    branches: [ feature/my-project ]
  pull_request:
    branches: [ feature/my-project ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: echo "build is in progress"
#     run: ./gradlew build

    - name: Run tests
      run: echo "test is in progress"
#     run: ./gradlew test
